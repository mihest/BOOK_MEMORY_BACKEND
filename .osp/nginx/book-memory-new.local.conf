server {
    listen       0.0.0.0:100;
    server_name  testtestbacks.itlabs.top www.testtestbacks.itlabs.top;

    root         'C:/OSPanel/home/book-memory-new.itlabs.top/public';
    index        index.php;

    access_log   'C:/OSPanel/logs/domains/testtestbacks.itlabs.top_access.log' combined;
    error_log    'C:/OSPanel/logs/domains/testtestbacks.itlabs.top_error.log' error;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        include        fastcgi_params;
        fastcgi_pass   127.127.126.62:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
}
