vich_uploader:
    db_driver: orm

    mappings:
        people_media:
            uri_prefix: /media/people
            upload_destination: '%kernel.project_dir%/public/media/people'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        people_images:
            uri_prefix: /uploads/people_images
            upload_destination: '%kernel.project_dir%/public/uploads/people_images'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
